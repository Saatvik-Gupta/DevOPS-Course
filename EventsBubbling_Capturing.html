<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    .grand{
        height: 400px;
        width:400px;
        border:2px solid rgb(216, 110, 10);
    }

    .father{
        height:200px;
        width:200px;
        margin:20px;
        padding:20px;
        border:2px solid rgb(74, 19, 146);
    }

    .child{
        height:50px;
        margin: 50px;
        border:2px solid rgb(150, 25, 25);
    }
</style>
</head>
<body>
    <div class="grand">Grandparent
        <div class="father">Father Box
        <div class="child">Child Box</div>
        </div>
    </div>

    <script>
        const content1=document.getElementsByClassName("grand")[0];
        content1.addEventListener("click",function(){
            alert("Grand Clicked")
        },false);

        //content1.addEventListener(eventname,function(){...},false/true) -->false by default 3 Arguments
        // true->Event Propogation outward to inward -->Event Capturing
        // false->Event Propogation inward to outward -->Event Bubbling

        const content2=document.getElementsByClassName("father")[0];
        content2.addEventListener("click",function(){
            alert("Father Clicked")
        },false);

        const content3=document.getElementsByClassName("child")[0];
        content3.addEventListener("click",function(){
            alert("Child Clicked")
           // e.stopPropagation(); -->Fancing child ka pop up only father and grand nhi
        },false);

        const content11=document.getElementsByClassName("grand")[0];
        content11.addEventListener("click",function(){
            alert("Grand Capturing Phase Clicked")
        },true);
    </script>


</body>
</html>
